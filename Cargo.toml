[package]
name = "hif2jpeg"
version = "0.2.0"
authors = ["Robert Brondijk <robert@brondijk.com>"]
license = "MIT"
edition = "2024"
publish = false

# `unsafe_code` is required for `#[no_mangle]`, disable workspace lints to workaround lint error.
# [lints]
# workspace = true

[lib]
# cdylib is required for Android, lib is required for desktop
crate-type = ["cdylib", "lib"]


[dependencies]

image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
heic-decoder = "0.1.0"
wide = "1.7.1"
enough = "0.4"

# Our ultrahdr crates
ultrahdr-rs = "0.3.4"
ultrahdr-core = { version = "0.4.0", default-features = false }


zenjpeg = { version = "0.8.4", features = ["ultrahdr", "decoder"] }
half = "2.7.1"

oxideav-pixfmt = "0.1.13"
bytemuck = "1.25.2"


eframe = {version="0.37.0", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
] }

egui_extras = {version = "0.37.0", features = ["default", "image"] }

#log = { version = "0.4.35", features = ["std"] }
winit = { version = "0.30.13", default-features = false }

robius-file-picker = "0.3.1"
jni = "0.22.4"




[target.'cfg(target_os = "android")'.dependencies]
robius-android-env = "0.2.0"
jni = "0.22.4"

[patch.crates-io]
robius-android-env = { path = "vendor/robius-android-env" }



[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
